<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atividade Avaliativa</title>
    <link rel="stylesheet" href="./styles/main.css" />

    <script type="text/javascript">
      (function (l) {
        if (l.search) {
          var q = {};
          l.search
            .slice(1)
            .split("&")
            .forEach(function (v) {
              var a = v.split("=");
              q[a[0]] = a.slice(1).join("=").replace(/~and~/g, "&");
            });
          if (q.p !== undefined) {
            window.history.replaceState(
              null,
              null,
              l.pathname.slice(0, -1) +
                (q.p || "") +
                (q.q ? "?" + q.q : "") +
                l.hash,
            );
          }
        }
      })(window.location);
    </script>

    <script src="./scripts/main.js" type="module"></script>
  </head>
  <body>
    <header class="header" id="navigation">
      <div class="header__container">
        <h1 class="header__title"><a href="/">Prática 2 DSM</a></h1>
        <nav class="header__nav">
          <ul id="dynamicMenu"></ul>
        </nav>
      </div>
    </header>

    <main id="content" class="main-content"></main>

    <footer class="footer">© Desenvolvido por Taís Souza</footer>
  </body>
</html>
